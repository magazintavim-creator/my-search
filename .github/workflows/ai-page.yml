name: ai-page
run-name: ai-page ${{ github.event.inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: "מזהה הבקשה (נוצר בתוסף)"
        required: true
      data:
        description: "כתובת הדף – מוצפנת"
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: כלים
        run: python -m pip install -q cryptography playwright

      - name: פתיחת הדף בכרום
        env:
          KEY_B64: ${{ secrets.AI_DL_KEY }}
          DATA: ${{ github.event.inputs.data }}
        run: |
          python - <<'PY'
          import base64, gzip, json, os
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from playwright.sync_api import sync_playwright

          key = base64.b64decode(os.environ["KEY_B64"])
          raw = base64.b64decode(os.environ["DATA"])
          req = json.loads(gzip.decompress(AESGCM(key).decrypt(raw[:12], raw[12:], None)))
          url = req["url"]
          print("::add-mask::" + url)
          W = 1280 if req.get("wide", True) else 412
          MAX_H = 7000

          res = {"url": url, "title": "", "text": "", "links": [], "shot": "", "w": W, "h": 0, "error": ""}
          with sync_playwright() as p:
              try:
                  browser = p.chromium.launch(channel="chrome", headless=True)
              except Exception:
                  os.system("python -m playwright install chromium > /dev/null")
                  browser = p.chromium.launch(headless=True)
              ctx = browser.new_context(locale="he-IL", viewport={"width": W, "height": 900},
                                        user_agent=req.get("ua") or None, device_scale_factor=1)
              pg = ctx.new_page()
              try:
                  pg.goto(url, wait_until="domcontentloaded", timeout=30000)
                  try:
                      pg.wait_for_load_state("networkidle", timeout=10000)
                  except Exception:
                      pass
                  # גלילה כדי שתמונות "עצלות" ייטענו
                  pg.evaluate("""async () => { for (let y = 0; y < Math.min(document.body.scrollHeight, 7000); y += 700) { window.scrollTo(0, y); await new Promise(r => setTimeout(r, 120)); } window.scrollTo(0, 0); }""")
                  pg.wait_for_timeout(800)
                  res["url"] = pg.url
                  res["title"] = pg.title()
                  info = pg.evaluate("""(maxH) => {
                      const links = [];
                      for (const a of document.querySelectorAll('a[href]')) {
                        const r = a.getBoundingClientRect();
                        const href = a.href;
                        if (!/^https?:/.test(href) || r.width < 4 || r.height < 4) continue;
                        const top = r.top + window.scrollY;
                        if (top > maxH) continue;
                        links.push({ href, text: (a.innerText || a.title || '').trim().slice(0, 120),
                                     x: Math.round(r.left + window.scrollX), y: Math.round(top), w: Math.round(r.width), h: Math.round(r.height) });
                        if (links.length >= 600) break;
                      }
                      return { links, text: (document.body ? document.body.innerText : '').slice(0, 60000),
                               h: Math.min(document.documentElement.scrollHeight, maxH) };
                  }""", MAX_H)
                  res["links"], res["text"], res["h"] = info["links"], info["text"], info["h"]
                  shot = pg.screenshot(full_page=True, type="jpeg", quality=62,
                                       clip={"x": 0, "y": 0, "width": W, "height": max(900, info["h"])})
                  res["shot"] = base64.b64encode(shot).decode()
              except Exception as e:
                  res["error"] = "%s: %s" % (type(e).__name__, str(e)[:200])
              browser.close()

          out = json.dumps(res, ensure_ascii=False)
          iv = os.urandom(12)
          enc = iv + AESGCM(key).encrypt(iv, gzip.compress(out.encode()), None)
          os.makedirs("pack", exist_ok=True)
          open("pack/page.txt", "w").write(base64.b64encode(enc).decode())
          print("ok" if not res["error"] else "error", len(res["shot"]), "links", len(res["links"]))
          PY

      - name: העלאה לנכסים
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "p-${{ github.event.inputs.job }}" pack/page.txt --title "ai-page" --notes "נמחק אוטומטית" --prerelease

      - name: דיווח על תקלה
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "פתיחת הדף נכשלה בריצה." > error.txt
          gh release create "p-${{ github.event.inputs.job }}" error.txt --title "ai-page error" --notes "" --prerelease || true

      - name: ניקוי דפים ישנים (מעל שעה)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '1 hour ago' +%s)
          gh release list --limit 100 --json tagName,createdAt -q '.[] | select(.tagName|startswith("p-")) | "\(.tagName) \(.createdAt)"' | while read tag created; do
            if [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ]; then gh release delete "$tag" --yes --cleanup-tag || true; fi
          done
